name: CI

# There was no workflow here at all, which meant the test suite never ran
# except on whoever's machine, and the Ruff rule set was documentation rather
# than a gate. Both now run on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the desktop platform. Linux is here for two tests in
        # test_vault.py that guard the POSIX branch of a path lookup and skip
        # themselves on Windows, so without it they never run anywhere.
        os: [windows-latest, ubuntu-latest]

    env:
      # Qt needs a platform plugin that needs no display. Set once here rather
      # than per test module: tests/conftest.py sets it too, for runs that do
      # not come through here, and both use setdefault so neither wins over the
      # other.
      QT_QPA_PLATFORM: offscreen

    steps:
      # v5 and v6 rather than v4 and v5. Those two run on Node 20, which GitHub
      # has retired; every run logged "Node.js 20 actions are deprecated" and
      # forced the step onto Node 24 anyway, which is a warning today and a
      # refusal later. setup-python v6 needs runner v2.327.1 or newer, which is
      # long since true of both GitHub-hosted images.
      - uses: actions/checkout@v5

      - name: Qt's system libraries
        # Windows and macOS images already carry what PySide6 links against.
        # Linux does not reliably, and the wheel does not ship them: importing
        # PySide6.QtWidgets fails on a missing libEGL or libxkbcommon, which
        # pytest reports as a collection error rather than as a missing
        # dependency. Skipped on the platform that needs it because the
        # dependency is named as the runner spells it.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --quiet --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          # requirements-dev.txt is listed because the step below installs it.
          # It was left out here, so the cache key did not change when the test
          # tooling changed and a runner could be handed a stale copy.
          cache-dependency-path: |
            requirements-desktop.txt
            requirements-network.txt
            requirements-dev.txt

      - name: Install
        # Every dependency comes from the requirements files rather than being
        # listed here. This step used to name pytest and pytest-asyncio itself
        # and install the rest from requirements-desktop.txt, and pydantic --
        # which src/messages/envelope.py imports -- was in neither. So the suite
        # never ran on a CI runner and pytest exited without collecting
        # anything. tests/test_dependencies.py now fails the build if that
        # happens again.
        run: python -m pip install -r requirements-desktop.txt -r requirements-dev.txt

      - name: Collect
        # Its own step, so that a module which fails to import is reported as a
        # collection failure instead of being buried in the run below. pytest
        # exits 2 on a collection error and 1 on a test failure, and the two
        # look identical from the run page, which is how a job was here
        # failing in four seconds with nothing to say why.
        run: python -m pytest tests --collect-only -q || true

      - name: Tests
        # -rf so the summary names the failures, and the tail of the output goes
        # to the job summary rather than only to the log, because the log sits
        # behind a token that needs read access on the actions scope while the
        # summary is on the page anyone can open. Output is captured to a file
        # and replayed rather than piped, so the exit status is pytest's own
        # rather than tee's.
        # bash on both platforms. The default on a Windows runner is PowerShell,
        # where this block is a syntax error, so it silently did nothing there:
        # the run failed with an exit code and reported no test names at all.
        shell: bash
        run: |
          python -m pytest tests -rf --tb=line > pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          {
            echo "### tests (${{ matrix.os }})"
            echo ""
            echo '```'
            tail -n 40 pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The failing tests as annotations. The job summary above is the
          # human-facing half and lands on the run page, but it is not carried
          # on the check run itself, so a reader without read access on the
          # actions scope sees nothing but "exit code 1". An annotation is
          # carried on the check run, and one line per failure is all it takes
          # to name them.
          grep -E '^(FAILED|ERROR)' pytest-output.txt | while read -r line; do
            echo "::error title=${{ matrix.os }}::${line}"
          done
          exit $status

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install ruff==0.16.8
      - name: Ruff
        # Reads [tool.ruff] from pyproject.toml, which reaches main through the
        # rule-set change. Ruff itself is a developer tool rather than something
        # the app installs, so it is not in any requirements file; it is pinned
        # here to the version the config was written against.
        run: python -m ruff check .